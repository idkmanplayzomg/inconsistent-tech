<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile · Incon2131</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- 🚨 Shutdown banner -->
<div class="shutdown-banner">
  Google+ will shut down for consumers on April 2, 2019.
</div>

<header class="topbar">
  <img src="logo.png" class="logo-2016">
</header>

<section class="profile-header">
  <img id="profileBanner" class="profile-banner">
  <div class="profile-meta">
    <img id="profileAvatar" class="profile-avatar">
    <div>
      <h1 id="profileName"></h1>
      <p id="profileBio" class="muted"></p>
    </div>
  </div>
</section>

<nav class="profile-tabs">
  <button class="tab active">Posts</button>
  <button class="tab">About</button>
</nav>

<main class="feed">
  <div id="profilePosts" class="post-grid"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="profile.js"></script>
</body>
</html>
