<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Profile</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="profile" style="display:none" id="profileRoot">

  <img id="avatar" class="avatar">
  <h2 id="username"></h2>

  <!-- EDIT UI (HIDDEN BY DEFAULT) -->
  <div id="editUI" style="display:none">
    <input id="nameInput" placeholder="New display name">
    <button id="saveBtn" class="primary">Save</button>
  </div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyATdGm6FTkeLlbbQr36CtB-kwN0LC3PGoI",
  authDomain: "inconforum.firebaseapp.com",
  projectId: "inconforum"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const params = new URLSearchParams(location.search);
const profileUID = params.get("uid");

const root = document.getElementById("profileRoot");
const editUI = document.getElementById("editUI");

auth.onAuthStateChanged(async user => {

  const snap = await db.collection("users").doc(profileUID).get();
  if (!snap.exists) return alert("Profile not found");

  const data = snap.data();

  document.getElementById("username").textContent = data.username || "User";
  document.getElementById("avatar").src = data.photo || "default.png";

  root.style.display = "block";

  // 🔒 OWNER CHECK (THIS IS THE FIX)
  if (user && user.uid === profileUID) {
    editUI.style.display = "block";
  }
});

document.getElementById("saveBtn").onclick = async () => {
  const val = document.getElementById("nameInput").value.trim();
  if (!val) return;

  await db.collection("users").doc(profileUID).update({
    username: val
  });

  location.reload();
};
</script>

</body>
</html>
