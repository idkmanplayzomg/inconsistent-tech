<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Loogle Profile</title>

<link rel="stylesheet" href="styles.css"/>
</head>

<body>

<header class="topbar">
  <h1 id="logo">Loogle+</h1>
</header>

<main class="layout">

  <section class="main">
    <div class="compose-card">

      <h2>You, on Loogle+</h2>
      <p class="muted">
        This information will be used to judge you.
      </p>

      <label>Public name</label>
      <input
        type="text"
        id="displayName"
        placeholder="What people call you"
      />

      <label style="margin-top:12px;">Profile picture</label>
      <label class="file-label">
        <input
          type="file"
          id="avatarFile"
          accept="image/*"
        />
        <span class="file-text">Change face</span>
      </label>

      <button
        id="saveBtn"
        class="primary"
        style="margin-top:16px;"
      >
        Save identity
      </button>

    </div>
  </section>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyATdGm6FTkeLlbbQr36CtB-kwN0LC3PGoI",
  authDomain: "inconforum.firebaseapp.com",
  projectId: "inconforum",
  storageBucket: "inconforum.appspot.com",
  messagingSenderId: "1545059128",
  appId: "1:1545059128:web:2327d2fce916a85e659fcd"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;

const displayNameInput = document.getElementById("displayName");
const avatarFile = document.getElementById("avatarFile");
const saveBtn = document.getElementById("saveBtn");
const logo = document.getElementById("logo");

logo.addEventListener("click", () => location.href = "index.html");

onAuthStateChanged(auth, user => {
  if (!user) {
    location.href = "index.html";
    return;
  }
  currentUser = user;
  displayNameInput.value = user.displayName || "";
});

saveBtn.addEventListener("click", async () => {
  if (!currentUser) return;

  let avatarURL = currentUser.photoURL || "";

  if (avatarFile.files[0]) {
    const file = avatarFile.files[0];
    const storageRef = ref(storage, `avatars/${currentUser.uid}_${Date.now()}.png`);
    await uploadBytes(storageRef, file, { contentType: file.type });
    avatarURL = await getDownloadURL(storageRef);
  }

  await updateProfile(currentUser, {
    displayName: displayNameInput.value.trim(),
    photoURL: avatarURL
  });

  const q = query(collection(db, "posts"), where("uid", "==", currentUser.uid));
  const snap = await getDocs(q);

  for (const d of snap.docs) {
    await updateDoc(doc(db, "posts", d.id), {
      username: displayNameInput.value.trim(),
      avatar: avatarURL
    });
  }

  alert("Identity updated. Loogle remembers everything.");
});
</script>

</body>
</html>
