<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Incon2131</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
  <img src="logo.png" class="logo-2016" alt="Incon2131" width="125px" height="50px">

  <div class="actions">
    <button id="loginBtn" class="btn">Sign in</button>
    <button id="logoutBtn" class="btn" style="display:none">Sign out</button>
  </div>
</header>

<main class="feed">

  <div class="card share-card">
    <textarea id="postBody" placeholder="Share what’s new…"></textarea>

    <div class="share-actions">
      <input id="postImage" type="file" accept="image/*">
      <button id="submitPostBtn" class="primary">Post</button>
    </div>

    <div id="postingStatus" class="status"></div>
  </div>

  <div id="posts" class="post-grid"></div>

</main>

<!-- 🔥 FIREBASE COMPAT (NO CORS ISSUES) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script src="forum.js"></script>
</body>
</html>
